name: Atualizar dados
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar dados na football-data.org
        run: python3 scripts/buscar.py
        env:
          FOOTBALL_KEY: ${{ secrets.FOOTBALL_KEY }}
      - name: Salvar data.json
        run: |
          git config user.name "scorelab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Atualiza dados" && git push)
